# Local Supabase CLI project settings. Remote project IDs and secrets belong in
# operator configuration and are intentionally not checked into this file.
project_id = "nutrition-assistant-mobile"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false
sql_paths = []

[storage]
enabled = true

[auth]
additional_redirect_urls = ["nutritionassistant://auth/callback"]
